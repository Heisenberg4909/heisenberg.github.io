<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Станция 1: Информатика</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="hist-bg">
    <div class="container">
        <h1>Станция 5: История</h1>
        <p>Назовите год начала Великой Отечественной войны.</p>
        <input type="text" id="answer">
        <button onclick="checkAnswer()">Проверить</button>
        <p id="hint"></p>

        <script>
            function checkAnswer() {
                let answer = document.getElementById("answer").value.trim();
                if (answer === "1941") {
                    hint.innerHTML = "🎉 Поздравляем! Вы успешно прошли квест!";
                    hint.style.color = "green";
                } else {
                    hint.innerHTML = "❌ Неправильно! Попробуйте ещё раз.";
                    hint.style.color = "red";
                }
            }
        </script>
    </div>
</body>
</html>
