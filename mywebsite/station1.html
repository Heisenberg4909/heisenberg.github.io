<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Станция 1: Информатика</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="info-bg">
    <div class="container">
        <h1>Станция 1: «Сбой в коде»</h1>
        <p>Ты входишь в кабинет, и на экране появляется сообщение о сбое:
            <span class="error">"Ошибка 101011: несоответствие данных. Восстановите правильные значения."</span> </p>

        <p class="task">Введите ответ</p>
        <input type="text" id="answer">
        <button onclick="checkAnswer()">Проверить</button>
        <p id="hint"></p>

        <script>
            function checkAnswer() {
                let answer = document.getElementById("answer").value.toLowerCase().trim();
                let correctAnswer = "13100101001";
                let hint = document.getElementById("hint");

                if (answer === correctAnswer) {
                    hint.innerHTML = "✅ Верно! Следующая подсказка: Здесь слова обретают вторую жизнь на другом языке, а буквы образуют знакомые, но слегка изменённые слова.";
                    hint.style.color = "green";
                } else {
                    hint.innerHTML = "❌ Неправильно! Попробуйте ещё раз.";
                    hint.style.color = "red";
                }
            }
        </script>
    </div>
</body>
</html>
